<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python с нуля</title>
<meta name="description" content="10 уроков по Python для новичков. Код запускается прямо на странице, ставить ничего не нужно.">
<meta property="og:title" content="Python с нуля">
<meta property="og:description" content="10 уроков, 13 заданий с автопроверкой. Код запускается прямо в браузере.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230E1A2B'/%3E%3Cpath d='M9 10l7 6-7 6' fill='none' stroke='%23FFD43B' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M18 23h6' stroke='%23FFD43B' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;700&family=JetBrains+Mono:wght@400;500&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F9; --ink:#0E1A2B; --muted:#586780; --line:#D5DDE8; --soft:#E5EBF3;
  --panel:#0E1A2B; --panel-2:#16263D; --code:#E8EEF7; --code-dim:#8A9BB5;
  --accent:#FFD43B; --accent-d:#E8BC17; --blue:#2B5F8F;
  --ok:#1E9E62; --ok-bg:#E1F4EA; --bad:#C23B3B; --bad-bg:#FBE7E7;
  --head:"Unbounded","Golos Text",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 var(--body);-webkit-text-size-adjust:100%}
button,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.shell{display:grid;grid-template-columns:292px minmax(0,1fr);min-height:100vh}

/* меню уроков */
.side{position:sticky;top:0;height:100vh;overflow:auto;padding:28px 20px 24px;border-right:1px solid var(--line);background:#fff}
.brand{display:block;font:600 1.15rem/1.2 var(--head);color:var(--ink);text-decoration:none;margin-bottom:6px}
.meter{margin:14px 0 22px}
.meter-bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.meter-bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
.meter small{display:block;margin-top:6px;color:var(--muted);font-size:.82rem}
.lessons{list-style:none;margin:0;padding:0}
.lessons a{display:grid;grid-template-columns:2rem 1fr 1.2rem;gap:6px;align-items:baseline;padding:9px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:.97rem;line-height:1.35}
.lessons a:hover{background:var(--soft)}
.lessons a[aria-current="page"]{background:var(--accent);font-weight:500}
.lessons .n{font:500 .82rem var(--mono);color:var(--muted)}
.lessons a[aria-current="page"] .n{color:var(--ink)}
.lessons .ck{font-size:.85rem;color:var(--ok);font-weight:700}
.side-foot{margin-top:26px;color:var(--muted);font-size:.8rem;line-height:1.5}

.top{display:none}
main{padding:56px clamp(16px,5vw,72px) 80px;min-width:0}
.col{max-width:760px}

/* главная */
.hero h1{font:600 clamp(2.5rem,7vw,4.6rem)/1.02 var(--head);letter-spacing:-.02em;margin:0 0 18px}
.hero p.sub{font-size:1.2rem;max-width:34em;margin:0 0 28px;color:var(--muted)}
.cta{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;font-weight:700;padding:13px 22px;border-radius:10px;margin:8px 0 44px}
.cta:hover{background:#1c2f4d}
.toc{list-style:none;margin:8px 0 0;padding:0;border-top:1px solid var(--line)}
.toc a{display:grid;grid-template-columns:3rem 1fr;gap:8px;padding:16px 4px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.toc a:hover{background:#fff}
.toc .n{font:500 .95rem var(--mono);color:var(--muted);padding-top:3px}
.toc b{display:block;font-weight:700}
.toc span.d{color:var(--muted);font-size:.95rem}
.toc .ck{color:var(--ok)}

/* урок */
.lesson h1{font:600 clamp(1.9rem,4.4vw,2.8rem)/1.12 var(--head);letter-spacing:-.015em;margin:0 0 14px}
.lead{font-size:1.2rem;color:var(--muted);margin:0 0 34px;max-width:36em}
.lesson p{margin:0 0 18px;max-width:62ch}
code{font:500 .9em var(--mono);background:var(--soft);padding:.12em .38em;border-radius:5px;white-space:nowrap}
.note{border-left:4px solid var(--accent);background:#fff;padding:12px 16px;border-radius:0 8px 8px 0;margin:0 0 20px;max-width:62ch}

/* ячейка с кодом */
.cell{margin:6px 0 26px;border-radius:12px;background:var(--panel);overflow:hidden;box-shadow:0 1px 0 rgba(14,26,43,.08)}
.cell textarea.code{display:block;width:100%;border:0;resize:none;background:transparent;color:var(--code);font:400 .92rem/1.6 var(--mono);padding:16px 18px 10px;white-space:pre;overflow-x:auto;tab-size:4}
.cell textarea.code:focus-visible{outline:none;box-shadow:inset 3px 0 0 var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:8px 12px 12px;align-items:center}
.btn{border:0;border-radius:8px;padding:8px 15px;font-weight:700;font-size:.9rem;cursor:pointer;background:var(--panel-2);color:var(--code)}
.btn:hover{background:#1f3452}
.btn.primary{background:var(--accent);color:var(--ink)}
.btn.primary:hover{background:var(--accent-d)}
.btn:disabled{opacity:.55;cursor:progress}
.btn.ghost{background:transparent;color:var(--code-dim)}
.btn.ghost:hover{color:var(--code);background:var(--panel-2)}
.sp{flex:1}
.stdin{padding:0 12px 10px;color:var(--code-dim);font-size:.85rem}
.stdin textarea{display:block;width:100%;margin-top:4px;background:var(--panel-2);border:1px solid #274064;border-radius:8px;color:var(--code);font:400 .88rem/1.5 var(--mono);padding:8px 10px;resize:vertical}
.out{margin:0;padding:12px 18px 14px;background:#0A1322;color:#cfe3ff;font:400 .88rem/1.55 var(--mono);white-space:pre-wrap;word-break:break-word;border-top:1px solid #1d2f4a}
.out .err{color:#ff9d9d}
.out .dim{color:var(--code-dim)}
.verdict{padding:11px 18px;font-weight:500;font-size:.95rem}
.verdict.ok{background:var(--ok-bg);color:#0f6b40}
.verdict.bad{background:var(--bad-bg);color:#8d2222}
.verdict.info{background:#fff6cf;color:#5c4a00}
.sol{margin:0;padding:12px 18px;background:#102338;color:#bfe8cf;font:400 .88rem/1.55 var(--mono);white-space:pre;overflow-x:auto;border-top:1px solid #1d2f4a}
.sol-h{padding:8px 18px 0;background:#102338;color:#7fd3a3;font-size:.82rem}
.hint{margin:0;padding:11px 18px;background:#fff6cf;color:#5c4a00;font-size:.95rem}

.task{outline:2px solid transparent;transition:outline-color .3s}
.task.done{outline-color:var(--ok)}
.task-h{display:flex;gap:10px;align-items:baseline;margin:34px 0 8px;font:600 1.05rem/1.3 var(--head)}
.badge{font:500 .78rem var(--mono);background:var(--soft);padding:2px 8px;border-radius:99px;color:var(--muted)}
.badge.ok{background:var(--ok-bg);color:#0f6b40}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:48px;padding-top:24px;border-top:1px solid var(--line)}
.pager a{display:block;max-width:48%;padding:12px 16px;border-radius:10px;background:#fff;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:500}
.pager a:hover{border-color:var(--ink)}
.pager small{display:block;color:var(--muted);font-weight:400}
.pager .next{margin-left:auto;text-align:right}
.finish{margin-top:36px;padding:22px 24px;background:var(--accent);border-radius:14px}
.finish h3{font:600 1.3rem var(--head);margin:0 0 8px}
.finish p{margin:0}

@media (max-width:860px){
  .shell{display:block}
  .top{display:flex;position:sticky;top:0;z-index:5;justify-content:space-between;align-items:center;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line)}
  .top b{font:600 1rem var(--head)}
  .top button{background:var(--accent);border:0;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer}
  .side{position:fixed;inset:0 auto 0 0;z-index:10;width:min(86vw,320px);height:100%;transform:translateX(-102%);transition:transform .2s;box-shadow:none}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(14,26,43,.45)}
  main{padding-top:28px}
  body{font-size:16.5px}
  .cell textarea.code{font-size:.86rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="top"><b>Python с нуля</b><button id="menuBtn" aria-expanded="false" aria-controls="side">Уроки</button></div>
<div class="shell">
  <nav class="side" id="side" aria-label="Уроки"></nav>
  <main id="app"></main>
</div>

<script id="lessons-data">
const P = x => ({k:'p', x});
const N = x => ({k:'n', x});
const C = (code, o = {}) => ({k:'c', code:code.trim() + "\n", ...o});
const T = o => ({k:'t', ...o, starter:o.starter.trim() + "\n"});

const LESSONS = [
{
  id:'hello', title:'Привет, Python', blurb:'Первая программа и как вообще читать код.',
  lead:'Запускаем первую программу и разбираемся, что происходит.',
  blocks:[
    P(String.raw`Python — язык, на котором пишут Telegram-ботов, сайты, парсеры, игры и анализируют данные. Он читается почти как английский, поэтому с него удобно начинать.`),
    P(String.raw`Каждый блок с кодом на этой странице живой: его можно править и запускать кнопкой **Запустить** (или Ctrl+Enter). Первый запуск загружает Python в браузер — подожди несколько секунд, дальше всё быстро.`),
    C(String.raw`print("Привет, мир!")`),
    P(String.raw`‹print()› выводит значение на экран. Текст в кавычках называется **строкой**. Кавычки можно ставить двойные или одинарные — главное, чтобы закрывающая была такой же, как открывающая.`),
    C(String.raw`
print("Меня зовут Коля")
print(2 + 3)
print("2 + 3 =", 2 + 3)`),
    P(String.raw`Python выполняет строки сверху вниз, по одной. В последней строке у ‹print()› два значения через запятую — они выводятся через пробел.`),
    P(String.raw`Всё, что идёт после ‹#›, — комментарий. Python его пропускает, он нужен людям, которые читают код (включая тебя самого через неделю).`),
    C(String.raw`
# это комментарий, Python его не видит
print("Видно")  # комментарий можно писать и после кода
# print("А это не выведется")`),
    T({id:'hello-free', free:true,
      text:'Выведи на экран своё имя и сколько тебе лет. Любыми словами, главное — чтобы программа отработала без ошибок.',
      starter:String.raw`print("Меня зовут ...")`,
      solution:String.raw`print("Меня зовут Коля, мне 20 лет")`}),
    T({id:'hello-sec',
      text:'Python считает как калькулятор. Запиши в ‹result› количество секунд в сутках (24 часа × 60 минут × 60 секунд). Что такое переменная — в следующем уроке, но строку ‹result = …› ты уже можешь написать.',
      starter:String.raw`result = 0`,
      hint:'Перемножь три числа через ‹*›.',
      test:String.raw`assert result == 86400, f"Ожидалось 86400, а у тебя: {result}"`,
      solution:String.raw`result = 24 * 60 * 60`}),
  ]
},
{
  id:'vars', title:'Переменные и типы', blurb:'Хранить значения, считать и собирать текст.',
  lead:'Как хранить данные, считать и склеивать текст с числами.',
  blocks:[
    P(String.raw`Переменная — это имя, под которым Python хранит значение. Создаётся знаком ‹=›.`),
    C(String.raw`
name = "Коля"
age = 20
print(name, age)`),
    P(String.raw`Имя состоит из латинских букв, цифр и ‹_›, цифрой начинать нельзя. Принято писать маленькими буквами через подчёркивание: ‹user_name›.`),
    P(String.raw`У каждого значения есть **тип**. Четыре главных:`),
    C(String.raw`
print(type(42))        # int — целое число
print(type(3.14))      # float — число с точкой
print(type("текст"))   # str — строка
print(type(True))      # bool — да или нет: True / False`),
    P(String.raw`Арифметика: ‹+›, ‹-›, ‹*›. Деление ‹/› всегда даёт дробь, ‹//› — целую часть, ‹%› — остаток, ‹**› — степень.`),
    C(String.raw`
print(7 / 2)    # 3.5
print(7 // 2)   # 3
print(7 % 2)    # 1
print(2 ** 10)  # 1024`),
    P(String.raw`Склеивать текст и числа удобнее всего **f-строкой**: перед кавычкой ставишь ‹f›, а переменные пишешь в фигурных скобках.`),
    C(String.raw`
name = "Коля"
age = 20
print(f"{name}, тебе {age} лет, через год будет {age + 1}")`),
    P(String.raw`Спросить что-то у пользователя можно через ‹input()›. Он всегда возвращает строку, поэтому число надо превратить через ‹int()›. Ответы пиши в поле под кодом, по одному в строке.`),
    C(String.raw`
name = input("Как тебя зовут? ")
age = int(input("Сколько тебе лет? "))
print(f"Привет, {name}! Через 10 лет тебе будет {age + 10}")`, {stdin:"Коля\n20"}),
    T({id:'vars-total',
      text:'Товар стоит 250 €, куплено 4 штуки. Посчитай ‹total› (цена × количество) и собери f-строкой сообщение ‹msg› ровно такого вида: ‹Итого: 1000 €›. Не пиши 1000 руками — пусть считает Python.',
      starter:String.raw`
price = 250
count = 4

total = 0
msg = ""`,
      hint:'‹total = price * count›, а в f-строке подставь ‹{total}›.',
      test:String.raw`
assert total == 1000, f"total сейчас {total}, а нужно 1000"
assert msg == "Итого: 1000 €", f"msg сейчас {msg!r}"`,
      solution:String.raw`
price = 250
count = 4

total = price * count
msg = f"Итого: {total} €"`}),
  ]
},
{
  id:'if', title:'Условия', blurb:'if, elif, else — программа начинает решать сама.',
  lead:'Программа выбирает, что делать, в зависимости от данных.',
  blocks:[
    P(String.raw`Для решений есть ‹if›. Сначала условие и двоеточие, потом то, что выполнится, если условие верно. Это пишется **с отступом** в 4 пробела. В Python отступ — не красота, а часть синтаксиса.`),
    C(String.raw`
age = 17
if age >= 18:
    print("Можно")
else:
    print("Пока нельзя")`),
    P(String.raw`Сравнения: ‹==› равно (именно два знака, один — это присваивание), ‹!=› не равно, ‹<›, ‹>›, ‹<=›, ‹>=›. Результат сравнения — ‹True› или ‹False›.`),
    P(String.raw`Вариантов может быть много: ‹elif› (иначе если) и в конце ‹else›. Проверка идёт сверху вниз, срабатывает первый подошедший.`),
    C(String.raw`
score = 73
if score >= 90:
    print("Отлично")
elif score >= 70:
    print("Хорошо")
elif score >= 50:
    print("Зачёт")
else:
    print("Пересдача")`),
    P(String.raw`Условия соединяются: ‹and› — оба верны, ‹or› — хотя бы одно, ‹not› — наоборот.`),
    C(String.raw`
has_ticket = True
age = 10
if has_ticket and age >= 12:
    print("Проходи")
if not has_ticket or age < 12:
    print("Стоп")`),
    T({id:'if-advice',
      text:'Дана температура ‹temp›. Запиши в ‹advice› совет: ниже 10 — ‹"Тёплая куртка"›, от 10 до 19 — ‹"Ветровка"›, 20 и выше — ‹"Футболка"›. Кнопка «Проверить» прогонит твой код на нескольких температурах, строку ‹temp = …› она подменит сама.',
      starter:String.raw`
temp = 15
advice = ""`,
      hint:'Три ветки: ‹if temp < 10›, ‹elif temp < 20›, ‹else›.',
      test:String.raw`
src = "\n".join(l for l in __src__.splitlines() if not l.startswith("temp"))
for t, want in [(-5, "Тёплая куртка"), (9, "Тёплая куртка"), (10, "Ветровка"), (19, "Ветровка"), (20, "Футболка"), (35, "Футболка")]:
    g = {"temp": t}
    exec(src, g)
    assert g["advice"] == want, f"При temp = {t} нужно {want!r}, а у тебя {g['advice']!r}"`,
      solution:String.raw`
temp = 15
advice = ""
if temp < 10:
    advice = "Тёплая куртка"
elif temp < 20:
    advice = "Ветровка"
else:
    advice = "Футболка"`}),
  ]
},
{
  id:'loops', title:'Циклы', blurb:'for, while, break — повторять без копипаста.',
  lead:'Как заставить Python повторять действия, а не копировать код.',
  blocks:[
    P(String.raw`Цикл повторяет код. ‹for› проходит по набору значений, а ‹range(5)› выдаёт числа 0, 1, 2, 3, 4 — пять штук, начиная с нуля.`),
    C(String.raw`
for i in range(5):
    print("Круг", i)`),
    P(String.raw`‹range(1, 6)› — от 1 до 5 (правая граница не входит). Третий аргумент — шаг, он может быть отрицательным.`),
    C(String.raw`
for n in range(1, 6):
    print(n, "в квадрате =", n ** 2)

print("---")
for n in range(10, 0, -3):
    print(n)`),
    P(String.raw`Строку тоже можно перебирать — по буквам:`),
    C(String.raw`
for letter in "Python":
    print(letter)`),
    P(String.raw`‹while› крутится, пока условие верно. Следи, чтобы оно когда-нибудь стало ложным, иначе получится бесконечный цикл. Страница сама остановит такой код через 8 секунд.`),
    C(String.raw`
count = 3
while count > 0:
    print("Осталось", count)
    count -= 1      # то же, что count = count - 1
print("Пуск!")`),
    P(String.raw`‹break› выходит из цикла сразу, ‹continue› пропускает остаток круга и идёт к следующему.`),
    C(String.raw`
for n in range(1, 20):
    if n % 2 == 0:
        continue      # чётные пропускаем
    if n > 9:
        break         # дошли до 11 — хватит
    print(n)`),
    T({id:'loops-sum',
      text:'Посчитай в ‹total› сумму квадратов чисел от 1 до 10 (1 + 4 + 9 + …). Используй цикл.',
      starter:String.raw`
total = 0
# твой цикл ниже`,
      hint:'В каждом круге прибавляй ‹n ** 2› к ‹total›.',
      test:String.raw`assert total == 385, f"total сейчас {total}, а нужно 385"`,
      solution:String.raw`
total = 0
for n in range(1, 11):
    total += n ** 2`}),
  ]
},
{
  id:'lists', title:'Списки', blurb:'Много значений в одной переменной.',
  lead:'Хранить много значений сразу и обрабатывать их все одним циклом.',
  blocks:[
    P(String.raw`Список — упорядоченный набор значений в квадратных скобках. Хранить в нём можно что угодно и сколько угодно.`),
    C(String.raw`
games = ["Minecraft", "CS2", "Dota 2"]

<script>
(() => {
  'use strict';
  const PYODIDE = 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/';
  const TIMEOUT_MS = 8000;

  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmt = s => esc(s).replace(/‹(.+?)›/g, '<code>$1</code>').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

  // прогресс: что выполнено, хранится только в этом браузере
  const store = {
    get() { try { return JSON.parse(localStorage.getItem('pycourse') || '{}'); } catch (e) { return {}; } },
    set(v) { try { localStorage.setItem('pycourse', JSON.stringify(v)); } catch (e) {} }
  };
  let done = store.get();
  const tasksOf = l => l.blocks.filter(b => b.k === 't');
  const doneIn = l => tasksOf(l).filter(t => done[t.id]).length;
  const allTasks = LESSONS.reduce((n, l) => n + tasksOf(l).length, 0);
  const allDone = () => LESSONS.reduce((n, l) => n + doneIn(l), 0);

  /* ---------- Python в воркере: бесконечный цикл можно убить ---------- */
  function workerMain() {
    importScripts('__PYODIDE__pyodide.js');
    const ready = loadPyodide({ indexURL: '__PYODIDE__' });
    ready.then(() => postMessage({ type: 'ready' }), e => postMessage({ type: 'fail', msg: String(e) }));
    onmessage = async e => {
      const { id, code, test, stdin } = e.data;
      let py;
      try { py = await ready; } catch (err) { postMessage({ type: 'result', id, ok: false, fail: true, out: '', error: String(err) }); return; }
      postMessage({ type: 'started', id });
      let out = '';
      const lines = stdin ? stdin.split('\n') : [];
      py.setStdout({ batched: s => { out += s + '\n'; } });
      py.setStderr({ batched: s => { out += s + '\n'; } });
      py.setStdin({ stdin: () => (lines.length ? lines.shift() : undefined) });
      const ns = py.globals.get('dict')();
      ns.set('__src__', code);
      const res = { type: 'result', id, ok: true };
      try { await py.runPythonAsync(code, { globals: ns }); }
      catch (err) { res.ok = false; res.error = String(err.message || err); }
      if (res.ok && test) {
        try { await py.runPythonAsync(test, { globals: ns }); res.passed = true; }
        catch (err) { res.passed = false; res.testError = String(err.message || err); }
      }
      ns.destroy();
      res.out = out;
      postMessage(res);
    };
  }

  let worker = null, jobs = new Map(), seq = 0;
  function spawn() {
    const src = '(' + workerMain.toString().replace(/__PYODIDE__/g, PYODIDE) + ')()';
    worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
    worker.onmessage = e => {
      const m = e.data;
      if (m.type === 'started') { const j = jobs.get(m.id); if (j) { j.onStart(); j.timer = setTimeout(() => kill(m.id), TIMEOUT_MS); } }
      else if (m.type === 'result') { const j = jobs.get(m.id); if (j) { clearTimeout(j.timer); jobs.delete(m.id); j.resolve(m); } }
      else if (m.type === 'fail') { failAll(m.msg); }
    };
    worker.onerror = () => failAll('worker');
  }
  function failAll(msg) {
    for (const [id, j] of jobs) { clearTimeout(j.timer); j.resolve({ ok: false, fail: true, out: '', error: msg }); }
    jobs.clear(); if (worker) worker.terminate(); worker = null;
  }
  function kill(id) {
    const j = jobs.get(id); if (!j) return;
    jobs.delete(id); j.resolve({ ok: false, timeout: true, out: '' });
    if (worker) worker.terminate(); worker = null;
    for (const [i, o] of jobs) { clearTimeout(o.timer); o.resolve({ ok: false, timeout: true, out: '' }); }
    jobs.clear();
  }
  function runPy(code, test, stdin, onStart) {
    if (!worker) spawn();
    const id = ++seq;
    return new Promise(resolve => {
      jobs.set(id, { resolve, onStart });
      worker.postMessage({ id, code, test, stdin });
    });
  }

  /* ---------- ячейка с кодом ---------- */
  function errLine(msg) {
    const lines = msg.trim().split('\n');
    const last = lines[lines.length - 1];
    let ln = null;
    for (const l of lines) { const m = l.match(/File "<exec>", line (\d+)/); if (m) ln = m[1]; }
    return (ln ? `строка ${ln}: ` : '') + last;
  }

  function cell(b, taskMeta) {
    const t = taskMeta || null;
    const code0 = t ? t.starter : b.code;
    const root = el('div', 'cell' + (t ? ' task' : ''));
    const ta = el('textarea', 'code');
    ta.value = code0; ta.spellcheck = false; ta.wrap = 'off';
    ta.setAttribute('aria-label', 'Код Python, можно править');
    ta.setAttribute('autocapitalize', 'off'); ta.setAttribute('autocomplete', 'off'); ta.setAttribute('autocorrect', 'off');
    const fit = () => { ta.rows = Math.max(2, ta.value.split('\n').length); };
    fit();

    const stdinBox = el('div', 'stdin', 'Ответы для <code>input()</code>, по одному в строке:');
    const stdinTa = el('textarea'); stdinTa.rows = 2; stdinTa.value = b.stdin || ''; stdinTa.spellcheck = false;
    stdinBox.append(stdinTa);
    const showStdin = () => { stdinBox.hidden = !/\binput\s*\(/.test(ta.value); };
    showStdin();

    const bar = el('div', 'bar');
    const hasTest = !!(t && t.test);
    const btnRun = el('button', 'btn' + (hasTest ? '' : ' primary'), 'Запустить');
    const btnCheck = hasTest ? el('button', 'btn primary', 'Проверить') : null;
    bar.append(...[btnCheck, btnRun].filter(Boolean));
    let btnHint, btnSol;
    if (t && t.hint) { btnHint = el('button', 'btn ghost', 'Подсказка'); bar.append(btnHint); }
    if (hasTest && t.solution) { btnSol = el('button', 'btn ghost', 'Решение'); bar.append(btnSol); }
    bar.append(el('span', 'sp'));
    const btnReset = el('button', 'btn ghost', 'Сбросить'); bar.append(btnReset);

    const out = el('pre', 'out'); out.hidden = true;
    const verdict = el('div', 'verdict'); verdict.hidden = true;
    const extra = el('div');
    root.append(ta, stdinBox, bar, out, verdict, extra);

    const setVerdict = (cls, text) => { verdict.hidden = false; verdict.className = 'verdict ' + cls; verdict.textContent = text; };
    const mark = () => {
      if (!t || done[t.id]) return;
      done[t.id] = 1; store.set(done); root.classList.add('done');
      const bd = document.getElementById('badge-' + t.id);
      if (bd) { bd.textContent = 'готово'; bd.classList.add('ok'); }
      renderSide();
      const l = LESSONS.find(x => tasksOf(x).includes(t));
      if (l && doneIn(l) === tasksOf(l).length) refreshFinish();
    };
    if (t && done[t.id]) root.classList.add('done');

    let busy = false;
    async function go(check) {
      if (busy) return;
      busy = true; [btnRun, btnCheck].forEach(x => x && (x.disabled = true));
      out.hidden = false; out.innerHTML = '<span class="dim">' + (worker ? 'Выполняю…' : 'Загружаю Python — один раз, ~10 МБ…') + '</span>';
      verdict.hidden = true;
      const r = await runPy(ta.value, check && hasTest ? t.test : null, stdinTa.value, () => { out.innerHTML = '<span class="dim">Выполняю…</span>'; });
      busy = false; [btnRun, btnCheck].forEach(x => x && (x.disabled = false));
      if (r.fail) { out.innerHTML = '<span class="err">Не получилось загрузить Python. Нужен интернет (движок грузится с cdn.jsdelivr.net). Обнови страницу и попробуй ещё раз.</span>'; return; }
      if (r.timeout) { out.innerHTML = '<span class="err">Код работал дольше 8 секунд, я его остановил. Скорее всего, бесконечный цикл: проверь условие в while.</span>'; return; }
      let html = esc(r.out || '');
      if (!r.ok) html += (html ? '\n' : '') + '<span class="err">' + esc(errLine(r.error)) + '</span>';
      else if (!r.out) html = '<span class="dim">(программа ничего не вывела)</span>';
      out.innerHTML = html;
      if (!r.ok) return;
      if (check || (t && t.free)) {
        if (!hasTest) { mark(); setVerdict('ok', 'Выполнено'); }
        else if (r.passed) { mark(); setVerdict('ok', 'Верно! Задание выполнено.'); }
        else {
          const tl = (r.testError || '').trim().split('\n').pop().replace(/^AssertionError:\s*/, '');
          setVerdict('bad', 'Пока не сходится: ' + (tl || 'проверка не прошла'));
        }
      }
    }
    btnRun.onclick = () => go(!!(t && t.free));
    if (btnCheck) btnCheck.onclick = () => go(true);
    if (btnHint) btnHint.onclick = () => {
      let h = $('.hint', extra);
      if (!h) { h = el('p', 'hint', 'Подсказка: ' + fmt(t.hint)); extra.append(h); } else h.remove();
    };
    if (btnSol) {
      let armed = false, timer;
      btnSol.onclick = () => {
        const s = $('.sol', extra);
        if (s) { extra.innerHTML = ''; btnSol.textContent = 'Решение'; return; }
        if (!armed) { armed = true; btnSol.textContent = 'Точно показать?'; timer = setTimeout(() => { armed = false; btnSol.textContent = 'Решение'; }, 4000); return; }
        clearTimeout(timer); armed = false; btnSol.textContent = 'Скрыть решение';
        extra.append(el('div', 'sol-h', 'Один из вариантов решения'), Object.assign(el('pre', 'sol'), { textContent: t.solution.trim() }));
      };
    }
    btnReset.onclick = () => { ta.value = code0; stdinTa.value = b.stdin || ''; fit(); showStdin(); out.hidden = true; verdict.hidden = true; };

    ta.addEventListener('input', () => { fit(); showStdin(); });
    ta.addEventListener('focus', () => { if (!worker) spawn(); }, { once: true });
    let noTrap = false;
    ta.addEventListener('keydown', e => {
      if (e.key === 'Escape') { noTrap = true; return; }
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); go(hasTest); return; }
      if (e.key === 'Tab' && !e.shiftKey && !noTrap) { e.preventDefault(); ta.setRangeText('    ', ta.selectionStart, ta.selectionEnd, 'end'); fit(); return; }
      noTrap = false;
      if (e.key === 'Enter' && ta.selectionStart === ta.selectionEnd) {
        const pos = ta.selectionStart;
        const before = ta.value.slice(0, pos);
        const line = before.slice(before.lastIndexOf('\n') + 1);
        let indent = line.match(/^ */)[0];
        if (/:\s*$/.test(line)) indent += '    ';
        if (indent) { e.preventDefault(); ta.setRangeText('\n' + indent, pos, pos, 'end'); fit(); }
      }
    });
    return root;
  }

  /* ---------- экраны ---------- */
  const app = $('#app');
  const side = $('#side');
  let finishBox = null;

  function renderSide() {
    const cur = (location.hash.match(/^#\/(.+)$/) || [])[1];
    const pct = Math.round(allDone() / allTasks * 100);
    side.innerHTML = `<a class="brand" href="#/">Python с нуля</a>
      <div class="meter"><div class="meter-bar"><i style="width:${pct}%"></i></div><small>Заданий выполнено: ${allDone()} из ${allTasks}</small></div>
      <ol class="lessons">${LESSONS.map((l, i) => {
        const fin = doneIn(l) === tasksOf(l).length;
        return `<li><a href="#/${l.id}" ${l.id === cur ? 'aria-current="page"' : ''}><span class="n">${i + 1}</span><span>${esc(l.title)}</span><span class="ck">${fin ? '✓' : ''}</span></a></li>`;
      }).join('')}</ol>
      <p class="side-foot">Курс от Quorvox_team.<br>Python 3.12 работает прямо в браузере (Pyodide). Прогресс хранится только у тебя в браузере.</p>`;
  }

  function home() {
    document.title = 'Python с нуля';
    app.innerHTML = '';
    const col = el('div', 'col hero');
    col.append(el('h1', null, 'Python с нуля'));
    col.append(el('p', 'sub', `${LESSONS.length} уроков и ${allTasks} заданий с автопроверкой. Код запускается прямо на этой странице: ничего ставить не нужно.`));
    col.append(cell({ code: 'name = "мир"\nprint(f"Привет, {name}! Это настоящий Python.")\nprint(2 ** 100)\n' }));
    const next = LESSONS.find(l => doneIn(l) < tasksOf(l).length) || LESSONS[0];
    const started = allDone() > 0;
    const go = el('a', 'cta', started ? `Продолжить: ${esc(next.title)}` : 'Начать с первого урока');
    go.href = '#/' + (started ? next.id : LESSONS[0].id);
    col.append(go);
    const ol = el('ol', 'toc');
    LESSONS.forEach((l, i) => {
      const fin = doneIn(l) === tasksOf(l).length;
      const li = el('li'); const a = el('a', null, `<span class="n">${i + 1}</span><span><b>${esc(l.title)} ${fin ? '<span class="ck">✓</span>' : ''}</b><span class="d">${esc(l.blurb)}</span></span>`);
      a.href = '#/' + l.id; li.append(a); ol.append(li);
    });
    col.append(ol);
    app.append(col);
  }

  function lesson(id) {
    const i = LESSONS.findIndex(l => l.id === id);
    if (i < 0) return home();
    const l = LESSONS[i];
    document.title = `${l.title} · Python с нуля`;
    app.innerHTML = '';
    const col = el('article', 'col lesson');
    col.append(el('h1', null, `${i + 1}. ${esc(l.title)}`), el('p', 'lead', esc(l.lead)));
    let n = 0;
    for (const b of l.blocks) {
      if (b.k === 'p') col.append(el('p', null, fmt(b.x)));
      else if (b.k === 'n') col.append(el('div', 'note', fmt(b.x)));
      else if (b.k === 'c') col.append(cell(b));
      else if (b.k === 't') {
        n++;
        const h = el('div', 'task-h', `<span>Задание ${n}</span><span class="badge ${done[b.id] ? 'ok' : ''}" id="badge-${b.id}">${done[b.id] ? 'готово' : 'не выполнено'}</span>`);
        col.append(h, el('p', null, fmt(b.text)), cell(b, b));
      }
    }
    finishBox = el('div'); col.append(finishBox);
    const pager = el('div', 'pager');
    if (i > 0) { const a = el('a', 'prev', `<small>Назад</small>${esc(LESSONS[i - 1].title)}`); a.href = '#/' + LESSONS[i - 1].id; pager.append(a); }
    if (i < LESSONS.length - 1) { const a = el('a', 'next', `<small>Дальше</small>${esc(LESSONS[i + 1].title)}`); a.href = '#/' + LESSONS[i + 1].id; pager.append(a); }
    col.append(pager); app.append(col);
    refreshFinish(l, i);
  }
  function refreshFinish(l, i) {
    if (!finishBox) return;
    const cur = (location.hash.match(/^#\/(.+)$/) || [])[1];
    const idx = LESSONS.findIndex(x => x.id === cur); if (idx < 0) return;
    if (allDone() === allTasks) {
      finishBox.className = 'finish';
      finishBox.innerHTML = '<h3>Курс пройден</h3><p>Все задания выполнены. База Python у тебя есть. Дальше — свой проект: бот, парсер или сайт.</p>';
    } else if (doneIn(LESSONS[idx]) === tasksOf(LESSONS[idx]).length) {
      finishBox.className = 'finish';
      finishBox.innerHTML = '<h3>Урок пройден</h3><p>Все задания этого урока выполнены.</p>';
    } else { finishBox.className = ''; finishBox.innerHTML = ''; }
  }

  function route() {
    const m = location.hash.match(/^#\/(.+)$/);
    m ? lesson(m[1]) : home();
    renderSide(); closeMenu(); window.scrollTo(0, 0);
  }

  const menuBtn = $('#menuBtn');
  function closeMenu() { side.classList.remove('open'); menuBtn.setAttribute('aria-expanded', 'false'); }
  menuBtn.onclick = () => { const o = side.classList.toggle('open'); menuBtn.setAttribute('aria-expanded', String(o)); };
  document.addEventListener('click', e => { if (side.classList.contains('open') && !side.contains(e.target) && e.target !== menuBtn) closeMenu(); });
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
